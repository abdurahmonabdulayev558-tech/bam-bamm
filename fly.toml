# Fly.io uchun deploy sozlamasi
# Ishga tushirish: fly launch  (yoki fly deploy)
# Fly.io BEPUL va UXLAMAYDI — baza doimiy diskda saqlanadi.

app = "time-party"          # nom band bo'lsa, fly launch o'zi o'zgartiradi
primary_region = "fra"      # Frankfurt (O'zbekistonga eng yaqin)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_DIR = "/data"        # baza doimiy diskda

# Server holati (Fly ilovani tirik saqlab turadi — uxlamaydi)
[checks]
  [checks.web]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/state"
    timeout = "5s"
    type = "http"

# Doimiy disk — SQLite baza shu yerda saqlanadi
[[mounts]]
  source = "time_party_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false    # ⚠️ MUHIM: uxlab qolmasin!
  auto_start_machines = true
  min_machines_running = 1      # doim kamida 1 ta ishlab turadi

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 80
